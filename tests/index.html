<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ひらく 自動採点</title>
<style>
body { font: 14px/1.6 "Yu Gothic", Meiryo, sans-serif; margin: 20px; color: #222; background: #fafaf7; }
h1 { font-size: 20px; } table { border-collapse: collapse; width: 100%; max-width: 1100px; }
th { text-align: left; background: #e9ecf5; padding: 6px 10px; } td { padding: 4px 10px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
tr.ok td:first-child { color: #2f9e44; font-weight: 700; } tr.ng { background: #fff0f0; } tr.ng td:first-child { color: #e03131; font-weight: 700; } tr.skip { color: #999; }
td:nth-child(3) { color: #555; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
</style></head>
<body>
<div id="out">採点しています…（30秒ほど）</div>
<div id="app" class="app" hidden></div>
<script>window.addEventListener('error', (e) => { window.__err = String(e.message || e.error); }); window.addEventListener('unhandledrejection', (e) => { window.__err = String(e.reason && (e.reason.stack || e.reason.message) || e.reason); });</script>
<script type="module" src="tests.js"></script>
</body></html>
